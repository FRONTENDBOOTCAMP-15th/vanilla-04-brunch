<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>발견</title>
    <link rel="shortcut icon" type="image/x-icon" href="/brunch.svg" />
    <link rel="icon" type="image/svg" href="/brunch.svg" />
    <link rel="stylesheet" href="./search.css" />
    <link rel="stylesheet" href="../common/index.css" />
    <script type="module" src="../components/navi.ts"></script>
    <script type="module" src="./search.ts"></script>
  </head>
  <body>
    <div class="search-container">
      <div class="search-header">
        <h2 class="sr-only">검색 키워드 입력 창</h2>

        <div class="search-form-box">
          <form class="search-form" action="">
            <div class="search-input">
              <label class="sr-only" for="search-input-field">검색어 입력</label>
              <input id="search-input-field" name="search-input-field" type="text" placeholder="검색어 입력" />
            </div>
          </form>

          <button class="search-input-clear-btn" type="button" aria-label="검색어 지우기"></button>
        </div>

        <ul class="search-tab-list">
          <li class="search-tab-item">
            <button class="search-tab-btn search-posts-tab active" type="button">글</button>
          </li>
          <li class="search-tab-item">
            <button class="search-tab-btn search-authors-tab" type="button">작가</button>
          </li>
        </ul>
      </div>
      <!-- search-header -->

      <div class="search-keywords">
        <h3 class="search-title">추천 작가 키워드</h3>
        <p class="search-desc">일상의 따뜻한 위로, <span class="point">그림</span> 작가를 만나요</p>
        <ul class="search-keywords-list">
          <li class="search-keywords-item">
            <a href="">한의사</a>
          </li>
          <li class="search-keywords-item">
            <a href="">출간작가</a>
          </li>
          <li class="search-keywords-item">
            <a href="">에세이스트</a>
          </li>
          <li class="search-keywords-item">
            <a href="">에세이스트</a>
          </li>
        </ul>
      </div>
      <!-- search-keywords -->

      <div class="search-recent">
        <h3 class="search-title">최근검색어</h3>
        <ul class="search-recent-list">
          <li class="search-recent-item">
            <a href="">사진꿀</a>
            <button class="search-recent-delete-btn" type="button" aria-label="최근검색어 삭제"></button>
          </li>
          <li class="search-recent-item">
            <a href="">꿀</a>
            <button class="search-recent-delete-btn" type="button" aria-label="최근검색어 삭제"></button>
          </li>
        </ul>
      </div>
      <!-- search-recent -->

      <div class="search-result-posts">
        <div class="search-posts-filter">
          <h3 class="search-title">글 검색 결과 <span class="search-posts-total"></span>건</h3>
          <ul class="search-posts-filter-tab">
            <li class="search-posts-filter-item active"><a href="">정확도</a></li>
            <li class="search-posts-filter-item"><a href="">최신</a></li>
          </ul>
        </div>

        <div class="search-posts-list"></div>
      </div>
      <!-- search-result-posts -->

      <div class="search-result-authors">
        <h3 class="search-title">작가 검색 결과 <span class="search-author-total"></span>건</h3>
        <div class="search-author-list"></div>
      </div>
      <!-- search-result-authors -->

      <div class="search-empty">
        <img src="./images/brunch-icon.png" alt="brunch-icon" />
        <p>검색 결과가 없습니다.</p>
      </div>
      <!-- search-empty -->
    </div>
    <navi-bar></navi-bar>
  </body>
</html>
